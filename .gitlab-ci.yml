phpcs moodle:
  tags:
  - moodle
  stage: test
  image: gitlab.oncampus-system.de:5050/moodle/docker-templates:codesniffer
  script:
    - phpcs -s -p --colors --extensions=php,js --standard=moodle .
    
php-compatibility 8.3:
  tags:
  - moodle
  stage: test
  image: gitlab.oncampus-system.de:5050/moodle/docker-templates:codesniffer
  variables:
    PHPVERSION: "8.3"
  script:
    - >-
      phpcs -s -p --colors
      --standard=PHPCompatibility
      --extensions=php
      --runtime-set testVersion ${PHPVERSION} .